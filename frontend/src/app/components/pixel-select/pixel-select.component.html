<button
  #trigger
  type="button"
  class="pixel-select-trigger"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-label]="label"
  [attr.aria-expanded]="isOpen"
  [attr.aria-controls]="id"
  [attr.aria-activedescendant]="
    isOpen && active >= 0 ? id + '-' + active : null
  "
  [attr.aria-required]="required || null"
  [disabled]="disabled"
  (pointerdown)="triggerPointerDown()"
  (click)="toggle($event)"
  (keydown)="keydown($event)"
  (blur)="touched()"
>
  <span class="pixel-select-value"
    ><span class="pixel-select-text">{{ selectedLabel }}</span></span
  >
  <span class="pixel-select-arrow" aria-hidden="true"></span>
</button>
<!-- Cancel the surrounding label's click activation after an option is chosen. -->
<div
  #menu
  class="pixel-select-menu"
  popover="auto"
  role="listbox"
  [id]="id"
  [attr.aria-label]="label"
  [attr.aria-multiselectable]="multiple || null"
  (beforetoggle)="onBeforeToggle($event)"
  (mousedown)="$event.preventDefault()"
  (click)="$event.preventDefault()"
>
  @for (option of options; track option.value; let index = $index) {
    <div
      role="option"
      [id]="id + '-' + index"
      [attr.aria-selected]="selected(option)"
      [attr.aria-disabled]="optionDisabled(option) || null"
      [class.active]="active === index"
      (pointermove)="hover(index, $event)"
      (click)="choose(index)"
    >
      @if (multiple && !option.action) { <span class="pixel-select-check" [class.checked]="selected(option)" aria-hidden="true"></span> }
      {{ option.label }}
    </div>
  }
</div>
