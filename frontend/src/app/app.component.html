<header class="brand-header">
  <div class="brand-line">
    <a class="brand" routerLink="/admin">Bouncer</a>
    <span class="brand-subtitle">- Verify your wallet. Get your roles.</span>
  </div>
  <nav aria-label="Main navigation">
    <a class="button" routerLink="/admin">Control room</a
    ><a class="button" routerLink="/help">Help</a
    ><button type="button" (click)="toggleTheme()" [attr.aria-pressed]="light">
      <span class="button-label">
        <span aria-hidden="true">Light theme</span>
        <span aria-hidden="true">Dark theme</span>
        <span>{{ light ? 'Dark' : 'Light' }} theme</span>
      </span>
    </button>
    @if (showSignIn) {
      <a class="button" href="/api/portal/auth/login?return_to=/admin">
        Sign in with Discord
      </a>
    }
  </nav>
</header>
<main class="route-content">
  <router-outlet (activate)="onRouteActivate($event)" />
</main>
<footer class="app-footer">
  <span>Bouncer · Wallet verification</span
  ><a routerLink="/help">Wallets &amp; verification help</a
  ><span>Support never needs your seed phrase or private key.</span>
</footer>
