<header class="brand-header">
  <div>
    <a class="brand" routerLink="/admin">Bouncer</a>
    <p class="brand-subtitle">Verify your wallet. Get your roles.</p>
  </div>
  <nav aria-label="Main navigation">
    <a class="button" routerLink="/admin">Control room</a
    ><a class="button" routerLink="/help">Help</a
    ><button type="button" (click)="toggleTheme()" [attr.aria-pressed]="light">
      {{ light ? 'Dark' : 'Light' }} theme
    </button>
  </nav>
</header>
<main class="route-content"><router-outlet /></main>
<footer class="app-footer">
  <span>Bouncer · Wallet verification</span
  ><a routerLink="/help">Wallets &amp; verification help</a
  ><span>Support never needs your seed phrase or private key.</span>
</footer>
